# Python style settings for the engine's tools and tests: PEP-8, with the
# project's 3-space indents and 120-character lines (pycodestyle / flake8 read
# this; tools/ci/check_style.py checks the project's own rules).
[pycodestyle]
indent-size = 3
max-line-length = 120

[flake8]
indent-size = 3
max-line-length = 120
